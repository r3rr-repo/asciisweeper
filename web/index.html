<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>asciisweeper</title>
    <meta name="description" content="Minesweeper rendered as an ASCII terminal, drawn with WebGL." />
    <style>
      /* The canvas letterboxes itself in the terminal's default background, so
         the page background must be the same colour or the seams show. The real
         value is written here at boot from the palette. */
      :root { --term-bg: #000000; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--term-bg); }
      body { overflow: hidden; }
      #screen { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
      /* Off-screen but focusable: exists only so mobile keyboards appear and so
         paste/IME composition has somewhere to land. All visible text is drawn
         in the grid. */
      #ime {
        position: fixed; top: 0; left: 0; width: 1px; height: 1px;
        opacity: 0; border: 0; padding: 0; background: transparent; color: transparent;
      }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #aaaaaa; font: 14px ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" tabindex="0"></canvas>
    <input id="ime" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" />
    <div id="boot">loading&hellip;</div>
    <script>
      /*
       * Boot guard. Without this, anything that stops main.ts from running - the
       * wrong directory served, a missing wasm file, a blocked MIME type - leaves
       * the page sitting on "loading..." with only a console error to go on.
       *
       * The commonest mistake is serving the SOURCE tree: browsers cannot execute
       * TypeScript, so web/ has to go through the dev server, and only web/dist/
       * is servable as plain static files. We can detect that precisely, because
       * on the source page this script's sibling still has a .ts extension.
       */
      (function () {
        var el = document.getElementById("boot");
        var entry = document.querySelector('script[type=module][src]');
        var isSource = !!entry && /\.ts(\?|$)/.test(entry.getAttribute("src") || "");
        function diagnose(detail) {
          if (!el || window.__asciisweeperBooted) return;
          el.style.whiteSpace = "pre-wrap";
          el.style.textAlign = "left";
          el.style.padding = "0 16px";
          el.textContent = isSource
            ? "asciisweeper did not start.\n\n"
              + "This is the source page, and browsers cannot run TypeScript directly.\n"
              + "Use one of:\n\n"
              + "  ./build-web.sh --serve     dev server\n"
              + "  ./build-web.sh             then serve or copy web/dist/\n\n"
              + "Serving web/ as static files cannot work; web/dist/ is the built output."
            : "asciisweeper did not start.\n\n" + (detail || "See the browser console for details.");
        }
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") diagnose("Could not load " + (e.target.src || "the script bundle") + ".");
        }, true);
        setTimeout(diagnose, 2500);
      })();
    </script>
    <!--
      Relative on purpose. With an absolute "/src/main.ts" this page breaks the
      moment it is served from a subdirectory, because the browser then looks in
      the server root - and in this repo that is src/main.c, not main.ts.
      Vite rewrites this to the hashed bundle at build time.
    -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
