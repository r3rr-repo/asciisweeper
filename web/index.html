<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>asciisweeper - Minesweeper in ASCII, in your browser</title>
    <meta
      name="description"
      content="Classic Minesweeper rendered as an ASCII terminal and drawn with WebGL. Flood-fill reveals, chording, a live timer, and turn-based multiplayer."
    />
    <meta name="application-name" content="asciisweeper" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark" />
    <!-- Matches the palette's defaultBg, so the browser chrome does not flash a
         different colour around a page that is almost entirely terminal black. -->
    <meta name="theme-color" content="#000000" />

    <!--
      Icons and the manifest stay RELATIVE, because dist/ is designed to work in
      a subdirectory as well as at a domain root. The social tags below are the
      exact opposite: og:image and canonical must be absolute or the scrapers
      ignore them, which is why they need a build-time SITE_URL.
    -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="asciisweeper" />
    <meta property="og:title" content="asciisweeper - Minesweeper in ASCII" />
    <meta
      property="og:description"
      content="Classic Minesweeper rendered as an ASCII terminal and drawn with WebGL, with turn-based multiplayer against another player."
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="asciisweeper - Minesweeper in ASCII" />
    <meta
      name="twitter:description"
      content="Classic Minesweeper rendered as an ASCII terminal and drawn with WebGL, with turn-based multiplayer against another player."
    />

    <!--SITE_URL_ONLY
      Everything in this block needs an absolute URL. vite.config.ts fills in
      %SITE_URL% when it is set at build time and DELETES the whole block when it
      is not, because a relative or placeholder og:image is worse than none: the
      scrapers would cache a broken preview.
    -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An ASCII Minesweeper board in a terminal, flanked by two blocky player avatars."
    />
    <meta name="twitter:image" content="%SITE_URL%/social-card.png" />
    <meta
      name="twitter:image:alt"
      content="An ASCII Minesweeper board in a terminal, flanked by two blocky player avatars."
    />
    <!--/SITE_URL_ONLY-->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "asciisweeper",
        "description": "Classic Minesweeper rendered as an ASCII terminal and drawn with WebGL, with turn-based multiplayer.",
        "applicationCategory": "GameApplication",
        "genre": "Puzzle",
        "operatingSystem": "Any browser with WebGL",
        "browserRequirements": "Requires WebGL and WebAssembly",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <style>
      /* The canvas letterboxes itself in the terminal's default background, so
         the page background must be the same colour or the seams show. The real
         value is written here at boot from the palette. */
      :root { --term-bg: #000000; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--term-bg); }
      body { overflow: hidden; }
      #screen { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
      /* Off-screen but focusable: exists only so mobile keyboards appear and so
         paste/IME composition has somewhere to land. All visible text is drawn
         in the grid. */
      #ime {
        position: fixed; top: 0; left: 0; width: 1px; height: 1px;
        opacity: 0; border: 0; padding: 0; background: transparent; color: transparent;
      }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #aaaaaa; font: 14px ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" tabindex="0"></canvas>
    <input id="ime" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" />
    <div id="boot">loading&hellip;</div>
    <script>
      /*
       * Boot guard. Without this, anything that stops main.ts from running - the
       * wrong directory served, a missing wasm file, a blocked MIME type - leaves
       * the page sitting on "loading..." with only a console error to go on.
       *
       * The commonest mistake is serving the SOURCE tree: browsers cannot execute
       * TypeScript, so web/ has to go through the dev server, and only web/dist/
       * is servable as plain static files. We can detect that precisely, because
       * on the source page this script's sibling still has a .ts extension.
       */
      (function () {
        var el = document.getElementById("boot");
        var entry = document.querySelector('script[type=module][src]');
        var isSource = !!entry && /\.ts(\?|$)/.test(entry.getAttribute("src") || "");
        function diagnose(detail) {
          if (!el || window.__asciisweeperBooted) return;
          el.style.whiteSpace = "pre-wrap";
          el.style.textAlign = "left";
          el.style.padding = "0 16px";
          el.textContent = isSource
            ? "asciisweeper did not start.\n\n"
              + "This is the source page, and browsers cannot run TypeScript directly.\n"
              + "Use one of:\n\n"
              + "  ./build-web.sh --serve     dev server\n"
              + "  ./build-web.sh             then serve or copy web/dist/\n\n"
              + "Serving web/ as static files cannot work; web/dist/ is the built output."
            : "asciisweeper did not start.\n\n" + (detail || "See the browser console for details.");
        }
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") diagnose("Could not load " + (e.target.src || "the script bundle") + ".");
        }, true);
        setTimeout(diagnose, 2500);
      })();
    </script>
    <!--
      Relative on purpose. With an absolute "/src/main.ts" this page breaks the
      moment it is served from a subdirectory, because the browser then looks in
      the server root - and in this repo that is src/main.c, not main.ts.
      Vite rewrites this to the hashed bundle at build time.
    -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
